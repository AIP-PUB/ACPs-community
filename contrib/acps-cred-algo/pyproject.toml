[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acps-cred-algo"
version = "1.0.0"
description = "能力可信度评分与复合排序算法：Wilson 置信下界 + 多因子，零外部依赖"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "ACPs-Cred 参考实现工作组" }]
keywords = [
    "agent-interconnection",
    "aip",
    "trust",
    "reputation",
    "wilson-score",
    "ranking",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mulan Permissive Software License v2 (MulanPSL-2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/wushuaige0925-ship-it/ACPs-community"
Repository = "https://github.com/wushuaige0925-ship-it/ACPs-community"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acps_cred_algo = ["py.typed"]
