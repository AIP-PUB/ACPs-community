# monitor-server/config/fluent-bit/fluent-bit.conf
#
# 监听 demo-leader 和 demo-partner 的 Audit 日志文件，
# 逐行解析 JSON 后转发到 Kafka amp.audit topic。
#
# 启动（后台守护）：
#   fluent-bit -d -c /Users/huxiaofeng/Projects/acps/monitor-server/config/fluent-bit/fluent-bit.conf
#
# macOS 注意：Fluent Bit v5 Kafka output 默认 Workers=0（内联模式）在 macOS 下
# worker 线程无法启动（kqueue 事件循环 + pthread TLS 初始化问题）。
# 必须显式设置 Workers 1。参见：
#   https://github.com/fluent/fluent-bit/issues/11358
#   https://github.com/fluent/fluent-bit/pull/11099

[SERVICE]
    Flush           1
    Log_Level       info
    Parsers_File    /Users/huxiaofeng/Projects/acps/monitor-server/config/fluent-bit/parsers.conf

# ── demo-leader ──────────────────────────────────────────────────────────────
[INPUT]
    Name             tail
    Path             /Users/huxiaofeng/Projects/acps/demo-leader/logs/amp_audit.jsonl
    Tag              amp.audit
    Parser           amp_audit_json
    Refresh_Interval 2
    Read_From_Head   False
    DB               /tmp/fluentbit-leader-audit.db

# ── demo-partner（glob 匹配所有 partner 日志文件，每个 partner 一个独立文件）────
[INPUT]
    Name             tail
    Path             /Users/huxiaofeng/Projects/acps/demo-partner/logs/amp_audit_*.jsonl
    Tag              amp.audit
    Parser           amp_audit_json
    Refresh_Interval 2
    Read_From_Head   False
    DB               /tmp/fluentbit-partner-audit.db

# ── Kafka Output ──────────────────────────────────────────────────────────────
# Workers 1 是 macOS 必须项——默认 0（内联）导致 worker 线程无法启动（v5 bug）
# timestamp_key 设置为 _fb_ts：Fluent Bit 会在消息中注入一个时间戳字段，
# 默认名称是 @timestamp。这里重命名为 _fb_ts，
# monitor-server 的 AuditWriter 会在签名验证前剥离所有以 "@" 或 "_fb" 开头的元数据字段。
[OUTPUT]
    Name                              kafka
    Match                             amp.audit
    Brokers                           localhost:19092
    Topics                            amp.audit
    Workers                           1
    timestamp_key                     _fb_ts
    rdkafka.log.connection.close      false
    rdkafka.request.required.acks     1
    rdkafka.allow.auto.create.topics  true

# ── demo-leader heartbeat ─────────────────────────────────────────────────────
[INPUT]
    Name             tail
    Path             /Users/huxiaofeng/Projects/acps/demo-leader/logs/amp_heartbeat.jsonl
    Tag              amp.heartbeat
    Parser           amp_audit_json
    Refresh_Interval 2
    Read_From_Head   False
    DB               /tmp/fluentbit-leader-hb.db

# ── demo-partner heartbeat（glob 匹配每个 Agent 一个文件）───────────────────────
[INPUT]
    Name             tail
    Path             /Users/huxiaofeng/Projects/acps/demo-partner/logs/amp_heartbeat_*.jsonl
    Tag              amp.heartbeat
    Parser           amp_audit_json
    Refresh_Interval 2
    Read_From_Head   False
    DB               /tmp/fluentbit-partner-hb.db

# ── Kafka Output: amp.heartbeat ───────────────────────────────────────────────
# Workers 1 是 macOS 必须项（同 audit OUTPUT 说明）。
# observed_at_ms 由 broker LogAppendTime 提供，故无需注入 timestamp_key。
# rdkafka.allow.auto.create.topics false：amp.heartbeat 必须用 dev-infra 预建的
# LogAppendTime + 1 分区版本；禁止 Fluent Bit 误自动建出默认 CreateTime / 多分区 topic。
[OUTPUT]
    Name                              kafka
    Match                             amp.heartbeat
    Brokers                           localhost:19092
    Topics                            amp.heartbeat
    Workers                           1
    rdkafka.log.connection.close      false
    rdkafka.request.required.acks     1
    rdkafka.allow.auto.create.topics  false

