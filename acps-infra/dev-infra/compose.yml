# dev-infra/compose.yml — ACPs 共享开发基础设施
#
# 提供 postgres（多库）、redis、rabbitmq、nginx、keycloak、kafka（Redpanda）等开发依赖。
# 所有服务接入 acps-dev-net 外部网络，与各项目的 devcontainer 容器互通。
#
# 用法（独立启动 infra）：
#   docker network create acps-dev-net 2>/dev/null || true
#   docker compose -f dev-infra/compose.yml up -d
#
# 按需启用 profiles：
#   COMPOSE_PROFILES=redis docker compose -f dev-infra/compose.yml up -d
#   COMPOSE_PROFILES=rabbitmq docker compose -f dev-infra/compose.yml up -d
#   COMPOSE_PROFILES=gateway docker compose -f dev-infra/compose.yml up -d
#   COMPOSE_PROFILES=keycloak docker compose -f dev-infra/compose.yml up -d
#
# Redpanda（Kafka 兼容）由 dev-infra.sh 管理（不使用 profile），通过 just infra up kafka 启动。
# 宿主机通过 localhost:19092 连接（external listener）；90xx 预留给各应用服务。

name: dev-infra

services:
  dev-postgres:
    build:
      context: ./postgres
    image: acps-dev-postgres:pg17-pgvector
    pull_policy: never
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: postgres
    volumes:
      - dev-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dev-net

  dev-redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - dev-redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: [redis]
    networks:
      - dev-net

  dev-rabbitmq:
    image: rabbitmq:4.2-management-alpine
    container_name: dev-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: devpass
    volumes:
      - dev-mqdata:/var/lib/rabbitmq
      - ./certs/issued/rabbitmq:/certs:ro
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5671:5671"
      - "15672:15672"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics check_running && rabbitmq-diagnostics check_port_listener 5671 && rabbitmq-diagnostics check_port_listener 15672",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles: [rabbitmq]
    networks:
      - dev-net

  dev-nginx:
    image: nginx:1.27-alpine
    container_name: dev-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    profiles: [gateway]
    networks:
      - dev-net

  dev-keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: dev-keycloak
    restart: unless-stopped
    command:
      - start
      - --http-enabled=true
      - --hostname=localhost
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      - --health-enabled=true
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://dev-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: devpass
    depends_on:
      dev-postgres:
        condition: service_healthy
    volumes:
      - dev-keycloakdata:/opt/keycloak/data
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "9080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    profiles: [keycloak]
    networks:
      - dev-net

  dev-redpanda:
    image: redpandadata/redpanda:v26.1.9
    container_name: dev-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://dev-redpanda:9092,external://localhost:19092
      - --rpc-addr=dev-redpanda:33145
      - --advertise-rpc-addr=dev-redpanda:33145
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - dev-redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - dev-net

  dev-clickhouse:
    image: clickhouse/clickhouse-server:25.5-alpine
    container_name: dev-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: amp
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - dev-chdata:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "19010:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles: [clickhouse]
    networks:
      - dev-net

  dev-victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.111.0
    container_name: dev-victoria-metrics
    restart: unless-stopped
    command:
      - -retentionPeriod=30d
      - -httpListenAddr=:8428
    ports:
      - "8428:8428"
    volumes:
      - dev-vmdata:/victoria-metrics-data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health | grep -q 'OK\\|ok'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles: [victoria-metrics]
    networks:
      - dev-net

  dev-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: devpass
    volumes:
      - dev-miniodata:/data
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles: [minio]
    networks:
      - dev-net

  dev-opensearch:
    image: opensearchproject/opensearch:2.19.2
    container_name: dev-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - dev-opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: [opensearch]
    networks:
      - dev-net

networks:
  dev-net:
    name: acps-dev-net
    external: true

volumes:
  dev-pgdata:
  dev-redisdata:
  dev-mqdata:
  dev-keycloakdata:
  dev-redpandadata:
  dev-vmdata:
  dev-chdata:
  dev-miniodata:
  dev-opensearchdata:
