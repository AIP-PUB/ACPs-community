# image-mode 镜像打包基础镜像 digest 锁定表
# （； ）
#
# 两类索引，只回答"某个 runtime/infra 镜像 id 现在对应哪个 digest"，本身不决定
# 这次构建要不要产出某个镜像——"要构建哪些目标"由 image-targets.toml 决定
# （见 image-packaging/image-targets.example.toml）。
#
# [python_runtime] 按 "docker_platform,python_tag" 索引，应用镜像 Dockerfile
# 的 PYTHON_RUNTIME_IMAGE 构建参数从这里解析。
# [infra_base] 按 "infra_id,docker_platform" 索引，基础设施镜像 Dockerfile
# 的 FROM 基础镜像从这里解析。
#
# 记录约定（与 release/assembly/images.lock 一致）：
# - 只记录可跨机器 `docker pull`/`docker buildx imagetools inspect` 复现的
# registry digest，不能提交开发机本地 daemon 的 image id。
# - 对于官方多架构镜像（单个 repo/tag 下用同一个 manifest-list/index digest
# 覆盖多个平台），沿用 assembly/images.lock 里 runtime_smoke 表的既有惯例：
# 同一个 digest 出现在多个 platform key 下，实际拉取哪个平台的内容由
# `docker buildx build --platform` / `docker run --platform` 决定，不是
# 由 digest 本身区分。
# - 如果某个 infra 未来只有单架构镜像，或需要为不同平台使用不同 tag/digest，
# 直接在对应 platform key 填入不同的值即可，索引结构本身已经支持。
#
# 更新方式：
# docker buildx imagetools inspect <image>:<tag> # 读取 Digest: 字段
# docker buildx imagetools inspect <image>:<tag> --raw | jq.

[python_runtime]
# 与 release/assembly/images.lock 的 [runtime_smoke] 表使用同一个 digest：
# 应用最终发布包在装配阶段已经用这个镜像做过 wheelhouse 离线安装 + import 校验，
# 镜像打包阶段复用同一个 runtime 基础镜像，行为上与已验证过的 smoke 环境一致。
"linux/amd64,cp314" = "python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1"
"linux/arm64,cp314" = "python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1"

[infra_base]
