# image-mode 镜像打包目标清单示例。
#
# 只声明"这次要构建哪些镜像目标"；具体基础镜像 digest 一律从 image-inputs.lock 解析，
# 不在这里重复维护。platform 字段使用 Docker platform 形式（如 "linux/amd64"），
# 文件名/标签用到的 platform slug 由工具（lib/common.py）统一派生。
#
# 本文件覆盖 的正式应用镜像矩阵与 的基础设施镜像候选集合，
# 可直接用于 `--targets` 参数做整体矩阵构建，也可以复制后按需要精简。

# ---------------------------------------------------------------------------
# 应用镜像矩阵
# ---------------------------------------------------------------------------

