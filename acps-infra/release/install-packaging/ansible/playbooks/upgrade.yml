- name: "升级 — follow refresh-trust（§9.5.9 / BP13）"
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    acps_trust_bundle_run_probe: false
  tasks:
    - name: WARNING — 显式 opt-out follow refresh（矩阵禁用）
      when: hostvars['localhost']._acps_upgrade_follow_refresh_opt_out | default(false) | bool
      ansible.builtin.debug:
        msg: >-
          WARNING: acps_upgrade_follow_refresh_trust=false — skipping follow
          refresh-trust after ca_server upgrade（break-glass only；旁路收敛矩阵 /
          宣称收敛证据必须使用默认 follow=true 路径）

    - name: follow refresh-trust（复用 refresh_trust_bundle_run；不内嵌 renew）
      when: hostvars['localhost']._acps_upgrade_follow_refresh_trust | default(false) | bool
      ansible.builtin.include_role:
        name: cert_provision
        tasks_from: refresh_trust_bundle_run.yml

- name: "升级 — 基础 smoke"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    acps_smoke_include_demo: "{{ (demo_partner_enabled | bool) or (demo_leader_enabled | bool) }}"
  tasks:
    - name: 成功路径打印 committed vs requested（§9.5.8 / BP12）
      ansible.builtin.include_role:
        name: common
        tasks_from: print_upgrade_summary.yml

    - name: WARNING — 按请求跳过 smoke（§9.5.7 / BP11；收敛矩阵禁止）
      when: acps_upgrade_skip_smoke | default(false) | bool
      ansible.builtin.debug:
        msg: >-
          WARNING: acps_upgrade_skip_smoke=true — skipping basic smoke
          （break-glass only；旁路收敛矩阵 / 宣称收敛证据必须 skip_smoke=false）

    - name: 升级后基础 smoke
      when: not (acps_upgrade_skip_smoke | default(false) | bool)
      ansible.builtin.include_role:
        name: smoke_basic
