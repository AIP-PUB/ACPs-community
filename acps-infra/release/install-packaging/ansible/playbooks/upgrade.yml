        tasks_from: upgrade_one_component.yml

# G §5.3 / S2：CSV 含 CLI 与业务组件时，CLI 先于 registry/ca/discovery 等业务应用。
# host → upgrade_one（releases+current）；image → 既有扁平 upgrade_one_image（不得回归）。
- name: "升级 — control acps-cli"
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    acps_skip_state_commit: true
    acps_upgrade_component_key: acps_cli
    acps_upgrade_role: control_acps_cli
    acps_state_scope: control
    acps_runtime_root: "{{ acps_control_root | dirname }}"
    acps_state_root: "{{ acps_control_root | dirname }}/state"
  tasks:
    - name: host 模式确保控制节点 pinned CPython（acps_cli / §6.2）
      when: (acps_deploy_mode | default('image')) == 'host'
      ansible.builtin.include_role:
        name: install_python
      vars:
        acps_install_python: true

    - name: 升级 control CLI（经 upgrade_one 按 mode 分派）
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade_one_component.yml

- name: "升级 — registry_server"
  hosts: registry_server
  gather_facts: true
  become: true
  vars:
    acps_skip_state_commit: true
    acps_upgrade_component_key: registry_server
    acps_upgrade_role: registry_server
  tasks:
    - name: 检测现有 registry mTLS 监听器（image：docker inspect）
      when: (acps_deploy_mode | default('image')) == 'image'
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "{{ acps_compose_project_prefix }}-registry_server_mtls-1"
      register: _upgrade_reg_mtls_image
      failed_when: false
      changed_when: false

    - name: 检测现有 registry mTLS 监听器（host：systemctl）
      when: (acps_deploy_mode | default('image')) == 'host'
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - acps-registry_server_mtls.service
      register: _upgrade_reg_mtls_host
      failed_when: false
      changed_when: false

    - name: 已部署时保持 mTLS 监听器启用
      ansible.builtin.set_fact:
        registry_server_enable_mtls_listener: >-
          {{
            (
              (_upgrade_reg_mtls_image.rc | default(1) | int) == 0
            )
            if (acps_deploy_mode | default('image')) == 'image'
            else (
              (_upgrade_reg_mtls_host.rc | default(1) | int) == 0
            )
          }}

    - name: 升级单个组件
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade_one_component.yml

