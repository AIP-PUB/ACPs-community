---
# upgrade.yml — 组件升级（image / host 共用入口；按 acps_deploy_mode 分派承载）
#
# 与 site.yml（首装）入口分离。复用组件 role + common
# stage_artifact / deploy_*（image：compose up — 禁止 -v；host：releases+current）。
#
# 必需：-e acps_upgrade_components=registry_server[,ca_server,...]
# 可选：-e acps_upgrade_skip_smoke=true（默认 false）
# 可选：-e acps_upgrade_follow_refresh_trust=true|false
#   CSV 含 ca_server 时默认 true → 组件成功后、smoke 前 follow refresh-trust（§9.5.9 / BP13）。
#   显式 false → WARNING；旁路收敛矩阵禁止将该 opt-out 作证据。
#   仅 app（无 ca_server）不自动 refresh。不内嵌 renew-certs。
#
# 多组件顺序与 site 阶段依赖对齐（见下方 play）。
#
# 对应：playbooks/rollback.yml 读取 previous 并回切。

- name: "升级 — 规范化 + preflight"
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: 升级选择 preflight + 依赖探测
      ansible.builtin.include_role:
        name: common
        tasks_from: preflight_upgrade.yml

- name: "升级 — 集群基线 preflight"
  hosts: all
  gather_facts: true
  become: true
  roles:
    - role: baseline
  tasks:
    - name: 共享集群 preflight
      ansible.builtin.include_role:
        name: common
        tasks_from: preflight_cluster.yml

    - name: 将升级选择镜像到目标主机
      ansible.builtin.set_fact:
        _acps_upgrade_components: "{{ hostvars['localhost']['_acps_upgrade_components'] }}"

    # host 升级 stage app-release 需要 pinned acps_python_bin；site 会装，
    # 但 upgrade 独立入口无 fact 时须重跑 install_python（幂等）。
    - name: host 模式确保业务机 pinned CPython（acps_python_bin）
      when: (acps_deploy_mode | default('image')) == 'host'
      ansible.builtin.include_role:
        name: install_python
      vars:
        acps_install_python: true

# --- 按 C 顺序的组件 play（仅运行所选 key）---
# acps_skip_state_commit：role 部署不得在切换中途 commit；upgrade_one 在 health 后 commit。

- name: "升级 — postgresql"
  hosts: postgresql
  gather_facts: true
  become: true
  vars:
    acps_skip_state_commit: true
    acps_upgrade_component_key: postgresql
    acps_upgrade_role: postgresql
  tasks:
    - name: 升级单个组件
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade_one_component.yml

