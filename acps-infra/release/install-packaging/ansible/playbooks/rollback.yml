- name: "回滚 — 基础 smoke"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    acps_smoke_include_demo: "{{ (demo_partner_enabled | bool) or (demo_leader_enabled | bool) }}"
  tasks:
    - name: WARNING — 证书/trust 未随 ca_server 二进制回滚（§9.5.9 / BP14）
      when: "'ca_server' in (hostvars['localhost']._acps_rollback_components | default([]))"
      ansible.builtin.debug:
        msg: >-
          WARNING: rollback included ca_server — certificates/trust were NOT
          rolled back with the binary（产品边界：无证书 rollback）。若需对齐 trust，
          请手动 ansible-playbook … playbooks/refresh-trust-bundle.yml。
          回滚后勿用 site.yml 盖回（BP16）。

    - name: WARNING — 按请求跳过 smoke（§9.5.7 / BP11；收敛矩阵禁止）
      when:
        - acps_rollback_skip_smoke | default(false) | bool
        - "'ca_server' not in (hostvars['localhost']._acps_rollback_components | default([]))"
      ansible.builtin.debug:
        msg: >-
          WARNING: acps_rollback_skip_smoke=true — skipping basic smoke
          （break-glass only；旁路收敛矩阵 / 宣称收敛证据必须 skip_smoke=false）

    - name: 回滚后 smoke（含 ca_server 时强制至少 TLS 平面；§9.5.9 / BP14）
      when: >-
        (not (acps_rollback_skip_smoke | default(false) | bool))
        or ('ca_server' in (hostvars['localhost']._acps_rollback_components | default([])))
      ansible.builtin.include_role:
        name: smoke_basic
      vars:
        acps_smoke_tls_plane_only: >-
          {{
            (acps_rollback_skip_smoke | default(false) | bool)
            and ('ca_server' in (hostvars['localhost']._acps_rollback_components | default([])))
          }}
