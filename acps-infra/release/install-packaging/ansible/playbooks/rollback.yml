    acps_rollback_component_key: keycloak
    acps_rollback_role: keycloak
  tasks:
    - name: 回滚单个组件
      ansible.builtin.include_role:
        name: common
        tasks_from: rollback_one_component.yml

# 与 upgrade.yml 对齐：CLI 先于业务 app_release。
# host → rollback_one（切 previous releases）；image → 既有扁平重装 previous artifact（不得回归）。
- name: "回滚 — control acps-cli"
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    acps_skip_state_commit: true
    acps_rollback_component_key: acps_cli
    acps_rollback_role: control_acps_cli
    acps_state_scope: control
    acps_runtime_root: "{{ acps_control_root | dirname }}"
    acps_state_root: "{{ acps_control_root | dirname }}/state"
  tasks:
    - name: host 模式确保控制节点 pinned CPython（acps_cli rollback）
      when: (acps_deploy_mode | default('image')) == 'host'
      ansible.builtin.include_role:
        name: install_python
      vars:
        acps_install_python: true

    - name: host — 经 rollback_one 切 previous releases
      when: (acps_deploy_mode | default('image')) == 'host'
      ansible.builtin.include_role:
        name: common
        tasks_from: rollback_one_component.yml

    - name: image — 既有 control CLI 回滚（从 previous.artifact_id 重装；不得走 docker image 路径）
      when: (acps_deploy_mode | default('image')) == 'image'
      block:
        - name: 未选择时跳过 CLI
          when: "'acps_cli' not in (hostvars['localhost']['_acps_rollback_components'] | default([]))"
          ansible.builtin.meta: end_play

        - name: 解析 control CLI state 路径
          ansible.builtin.set_fact:
            _acps_rb_cli_state_file: "{{ (acps_control_root | dirname) }}/state/control/acps_cli.json"

        - name: 检查 control CLI state
          ansible.builtin.stat:
            path: "{{ _acps_rb_cli_state_file }}"
          register: _acps_rb_cli_stat

        - name: control CLI state 缺失时失败
          when: not (_acps_rb_cli_stat.stat.exists | bool)
          ansible.builtin.fail:
            msg: >-
              Cannot rollback acps_cli: no state at {{ _acps_rb_cli_state_file }}.
              Scene preserved.

        - name: 加载 control CLI state
          ansible.builtin.slurp:
            src: "{{ _acps_rb_cli_state_file }}"
          register: _acps_rb_cli_slurp

        - name: 解析 control CLI state
          ansible.builtin.set_fact:
            _acps_rb_cli_doc: "{{ _acps_rb_cli_slurp.content | b64decode | from_json }}"

        - name: 要求 control CLI previous
          when: >-
            (_acps_rb_cli_doc.previous is not defined)
            or (_acps_rb_cli_doc.previous is none)
            or (_acps_rb_cli_doc.previous is not mapping)
          ansible.builtin.fail:
            msg: >-
              Cannot rollback acps_cli: previous is null/absent. Scene preserved.

        - name: 绑定 control 回滚目标
          ansible.builtin.set_fact:
            _acps_rollback_target: "{{ _acps_rb_cli_doc.previous }}"

        - name: 校验 control CLI 的可选 acps_rollback_to
          when: (acps_rollback_to | default('') | string | length) > 0
          ansible.builtin.assert:
            that:
              - >-
                (acps_rollback_to | string) == (_acps_rollback_target.version | default('') | string)
                or (acps_rollback_to | string) == (_acps_rollback_target.artifact_id | default('') | string)
            fail_msg: >-
              acps_rollback_to={{ acps_rollback_to }} does not match retained acps_cli previous.
              Scene preserved.

        - name: 应用 control_acps_cli role（从安装包制品重装）
          ansible.builtin.include_role:
            name: control_acps_cli

        - name: "commit_state（control acps_cli 已恢复；清除 previous）"
          ansible.builtin.include_role:
            name: common
            tasks_from: commit_state.yml
          vars:
            acps_state_scope: control
            acps_runtime_root: "{{ acps_control_root | dirname }}"
            acps_state_root: "{{ acps_control_root | dirname }}/state"
            acps_state_version: "{{ _acps_rollback_target.version | default(acps_version) }}"
            acps_state_artifact_id: "{{ _acps_rollback_target.artifact_id }}"
            acps_state_image_tag: ""
            acps_state_clear_previous: true

- name: "回滚 — registry_server"
  hosts: registry_server
  gather_facts: true
  become: true
  vars:
    acps_skip_state_commit: true
    acps_rollback_component_key: registry_server
    acps_rollback_role: registry_server
  tasks:
    - name: 检测现有 registry mTLS 监听器（image：docker inspect）
      when: (acps_deploy_mode | default('image')) == 'image'
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "{{ acps_compose_project_prefix }}-registry_server_mtls-1"
      register: _rollback_reg_mtls_image
      failed_when: false
      changed_when: false

    - name: 检测现有 registry mTLS 监听器（host：systemctl）
      when: (acps_deploy_mode | default('image')) == 'host'
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - acps-registry_server_mtls.service
      register: _rollback_reg_mtls_host
      failed_when: false
      changed_when: false

    - name: 已部署时保持 mTLS 监听器启用
      ansible.builtin.set_fact:
        registry_server_enable_mtls_listener: >-
          {{
            (
              (_rollback_reg_mtls_image.rc | default(1) | int) == 0
            )
            if (acps_deploy_mode | default('image')) == 'image'
            else (
              (_rollback_reg_mtls_host.rc | default(1) | int) == 0
            )
          }}

    - name: 回滚单个组件
      ansible.builtin.include_role:
        name: common
        tasks_from: rollback_one_component.yml

