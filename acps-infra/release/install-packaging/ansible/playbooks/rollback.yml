---
# rollback.yml — 制品回滚（image / host 共用入口；按 acps_deploy_mode 分派承载）
#
# 与 site.yml / upgrade.yml 入口分离。将所选组件恢复至
# 保留的 previous（或与之匹配的 acps_rollback_to）。
# image：复用组件 role + compose up / up-recreate — 禁止 down -v。
# host：current → previous releases/（app_release）；os_package 默认拒绝（不降包）。
# 不执行 DB migrate-downgrade，不回滚证书（证书流程保持独立）。
# 回滚 CSV 含 ca_server：不改证书/trust；强制至少 TLS smoke + 醒目 WARN（§9.5.9 / BP14）。
#
# 必需：-e acps_rollback_components=registry_server[,ca_server,...]
# 可选：-e acps_rollback_to=<previous.version|previous.image_tag|artifact_id|release_path>
# 可选：-e acps_rollback_skip_smoke=true（默认 false；含 ca_server 时仍强制 TLS 平面）

- name: "回滚 — 规范化 + preflight"
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: 回滚选择 preflight
      ansible.builtin.include_role:
        name: common
        tasks_from: preflight_rollback.yml

- name: "回滚 — 集群基线 preflight"
  hosts: all
  gather_facts: true
  become: true
  roles:
    - role: baseline
  tasks:
    - name: 共享集群 preflight
      ansible.builtin.include_role:
        name: common
        tasks_from: preflight_cluster.yml

    - name: 将回滚选择镜像到目标主机
      ansible.builtin.set_fact:
        _acps_rollback_components: "{{ hostvars['localhost']['_acps_rollback_components'] }}"

    # host 回滚 render/entrypoint 需要 pinned acps_python_bin；site/upgrade 会装，
    # 但 rollback 独立入口无 fact 时须重跑 install_python（幂等；与 upgrade.yml 对齐）。
    - name: host 模式确保业务机 pinned CPython（acps_python_bin）
      when: (acps_deploy_mode | default('image')) == 'host'
      ansible.builtin.include_role:
        name: install_python
      vars:
        acps_install_python: true

# --- 按 C 顺序的组件 play（仅运行所选 key）---
# acps_skip_state_commit：role 部署不得在切换中途 commit；rollback_one 在 health 后 commit。

- name: "回滚 — postgresql"
  hosts: postgresql
  gather_facts: true
  become: true
  vars:
    acps_skip_state_commit: true
    acps_rollback_component_key: postgresql
    acps_rollback_role: postgresql
  tasks:
    - name: 回滚单个组件
      ansible.builtin.include_role:
        name: common
        tasks_from: rollback_one_component.yml

- name: "回滚 — keycloak"
