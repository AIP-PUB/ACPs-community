---
# demo_partner/tasks/main_host.yml — host 模式：app_release venv/systemd
# （本设计 §8.1 / Step 17）。

- name: 确保运行时目录
  ansible.builtin.include_role:
    name: common
    tasks_from: ensure_runtime_dirs.yml

- name: stage demo_partner app_release
  ansible.builtin.include_role:
    name: common
    tasks_from: stage_artifact.yml
  vars:
    acps_component_key: demo_partner
    acps_artifact_kind: app_release
    acps_host_app_pip_packages: ["demo-partner"]

- name: 派生对等主机
  ansible.builtin.set_fact:
    _advertise: "{{ acps_advertise_host | default(ansible_host) | default('127.0.0.1') }}"
    _rmq_host: "{{ hostvars | acps_group_addr(groups, 'rabbitmq') }}"
    _registry_host: "{{ hostvars | acps_group_addr(groups, 'registry_server') }}"
    _ca_host: "{{ hostvars | acps_group_addr(groups, 'ca_server') }}"
    _discovery_host: "{{ hostvars | acps_group_addr(groups, 'discovery_server') }}"
    _mq_host: "{{ hostvars | acps_group_addr(groups, 'mq_auth_server') }}"
    _pg_host: "{{ hostvars | acps_group_addr(groups, 'postgresql') }}"

- name: "派生 acps_psql.sh mode 参数（image: --container；host: --host/--port）"
  ansible.builtin.set_fact:
    _pg_psql_mode_args: >-
      {{
        ('--mode image --container ' ~ acps_compose_project_prefix ~ '-postgresql-1')
        if acps_deploy_mode == 'image'
        else ('--mode host --host ' ~ _pg_host ~ ' --port ' ~ (postgresql_port | string))
      }}

- name: 准备 demo_partner 目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ acps_systemd_user }}"
    group: "{{ acps_systemd_group }}"
  loop:
    - "{{ acps_runtime_root }}/config/demo_partner"
    - "{{ acps_runtime_root }}/components/demo_partner"

- name: 展开 demo_partner partners 树（初始 ACS）
  ansible.builtin.copy:
    src: "{{ acps_release_root }}/templates/demo_partner/partners/"
    dest: "{{ acps_runtime_root }}/components/demo_partner/partners/"
    mode: "0644"
    force: false
    owner: "{{ acps_systemd_user }}"
    group: "{{ acps_systemd_group }}"

- name: 渲染 demo_partner host 应用单元（app.env + systemd）
  ansible.builtin.include_role:
    name: common
    tasks_from: render_host_app_unit.yml
  vars:
    acps_compose_service_name: demo_partner
    acps_host_install_dest: "{{ acps_host_app_install_dest }}"
    acps_host_env_file: "{{ acps_runtime_root }}/config/demo_partner/app.env"
    acps_host_env_template_abs: "{{ playbook_dir }}/../roles/demo_partner/templates/env.host.j2"
    acps_host_component_id: demo-partner

- name: 断言 partner ACS 已 bootstrap（存在 AIC）
  ansible.builtin.shell: |
    set -euo pipefail
    missing=0
    for acs in "{{ acps_runtime_root }}/components/demo_partner/partners/online"/*/acs.json; do
      PY="{{ ansible_python_interpreter | default('python3') }}"
      aic=$("$PY" -c 'import json,sys; print(json.load(open(sys.argv[1])).get("aic") or "")' "$acs")
      if [[ -z "${aic}" ]]; then
        echo "missing AIC in $acs" >&2
        missing=1
      fi
      for f in server.pem server.key client.pem client.key trust-bundle.pem; do
        if [[ ! -f "$(dirname "$acs")/$f" ]]; then
          echo "missing $f beside $acs" >&2
          missing=1
        fi
      done
    done
    exit "${missing}"
  args:
    executable: /bin/bash
  changed_when: false

- name: stage ACS rewrite/assert scripts
  ansible.builtin.include_role:
    name: common
    tasks_from: stage_acs_rewrite_scripts.yml

- name: 重写 partner ACS 全部端点（HTTPS + AMQP + altNames；host 无 Compose DNS）
  ansible.builtin.shell: |
    set -euo pipefail
    ROOT="{{ acps_runtime_root }}/components/demo_partner/partners/online"
    RMQ_DNS="{{ _rmq_host }}"
    ADV="{{ _advertise }}"
    PY="{{ ansible_python_interpreter | default('python3') }}"
    SCRIPT="{{ acps_runtime_root }}/staging/rewrite_acs_endpoints.py"
    "$PY" "$SCRIPT" "$ROOT" --advertise-host "$ADV" --amqp-host "$RMQ_DNS"
  args:
    executable: /bin/bash
  register: _partner_acs_rewrite

- name: 为集群 RabbitMQ 广告地址重写 partner config.toml
  ansible.builtin.shell: |
    set -euo pipefail
    ROOT="{{ acps_runtime_root }}/components/demo_partner/partners/online"
    RMQ_DNS="{{ _rmq_host }}"
    PY="{{ ansible_python_interpreter | default('python3') }}"
    "$PY" - "$ROOT" "$RMQ_DNS" <<'PY'
    import re, sys
    from pathlib import Path
    root = Path(sys.argv[1])
    rmq = sys.argv[2].strip()
    changed = 0
    for path in sorted(root.glob("*/config.toml")):
        text = path.read_text(encoding="utf-8")
        section = None
        out = []
        dirty = False
        for line in text.splitlines(keepends=True):
            stripped = line.strip()
            if stripped.startswith("[") and stripped.endswith("]"):
                section = stripped[1:-1].strip()
                out.append(line)
                continue
            if section == "rabbitmq" and re.match(r"^host\s*=", stripped):
                new = f'host = "{rmq}"\n'
                if line != new:
                    dirty = True
                out.append(new)
                continue
            out.append(line)
        if dirty:
            path.write_text("".join(out), encoding="utf-8")
            changed += 1
            print(f"rewrote_config_toml {path}")
    print(f"partner_config_rewritten={changed}")
    PY
  args:
    executable: /bin/bash

- name: 断言 partner ACS（host：禁止 Compose DNS）
  ansible.builtin.shell: |
    set -euo pipefail
    PY="{{ ansible_python_interpreter | default('python3') }}"
    SCRIPT="{{ acps_runtime_root }}/staging/assert_acs_endpoints.py"
    "$PY" "$SCRIPT" "{{ acps_runtime_root }}/components/demo_partner/partners/online" \
      --advertise-host "{{ _advertise }}" --forbid-compose-dns
  args:
    executable: /bin/bash
  changed_when: false

- name: 将 acps_psql.sh stage 到目标
  when: postgresql_enabled | default(true) | bool
  ansible.builtin.include_role:
    name: common
    tasks_from: stage_acps_psql.yml

- name: 修补 Registry APPROVED partner ACS（JSONB：HTTPS/AMQP/active，host psql）
  when: postgresql_enabled | default(true) | bool
  ansible.builtin.shell: |
    set -euo pipefail
    ROOT="{{ acps_runtime_root }}/components/demo_partner/partners/online"
    PSQL="{{ acps_runtime_root }}/staging/acps_psql.sh"
    DB_USER="{{ registry_db_user }}"
    DB_NAME="{{ registry_db_name }}"
    ADV="{{ _advertise }}"
    PY="{{ ansible_python_interpreter | default('python3') }}"
    "$PY" - "$ROOT" "$DB_USER" "$DB_NAME" "{{ registry_db_password }}" "$PSQL" "{{ _pg_psql_mode_args }}" "$ADV" <<'PY'
    import hashlib, json, os, subprocess, sys
    from pathlib import Path
    root, db_user, db_name, db_pass, psql_bin, pg_mode_args, advertise = sys.argv[1:8]
    os.environ["PGPASSWORD"] = db_pass

    def psql(sql: str) -> str:
        return subprocess.check_output(
            [psql_bin, *pg_mode_args.split(), "--user", db_user, "--db", db_name,
             "--tuples-only", "--no-align", "--sql", sql],
            text=True,
        ).strip()

    updated = 0
    for path in sorted(Path(root).glob("*/acs.json")):
        data = json.loads(path.read_text(encoding="utf-8"))
        aic = (data.get("aic") or "").strip()
        if not aic:
            continue
        data["active"] = True
        current = psql(f"SELECT acs::text FROM agent WHERE aic = '{aic.replace(chr(39), chr(39)+chr(39))}' AND is_active")
        if not current:
            print(f"skip_missing {aic}")
            continue
        needs = (
            "https://localhost:" in current
            or "https://127.0.0.1:" in current
            or "amqps://localhost:" in current
            or "amqps://127.0.0.1:" in current
            or "amqps://rabbitmq:" in current
            or '"active": false' in current
            or '"active":false' in current
            or (advertise and f"https://{advertise}:" not in current)
        )
        if not needs:
            print(f"registry_ok {aic}")
            continue
        payload = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
        digest = hashlib.sha256(payload.encode("utf-8")).hexdigest()
        tag = "acsjson"
        sql = (
            f"UPDATE agent SET acs = ${tag}${payload}${tag}$::jsonb, "
            f"acs_hash = '{digest}', acs_version = COALESCE(acs_version, 0) + 1 "
            f"WHERE aic = '{aic.replace(chr(39), chr(39)+chr(39))}' AND is_active"
        )
        psql(sql)
        updated += 1
        print(f"registry_updated {aic}")
    print(f"registry_acs_updated={updated}")
    PY
  args:
    executable: /bin/bash
  no_log: true

- name: 解析 demo_partner 属主以设置证书所有权
  ansible.builtin.include_role:
    name: common
    tasks_from: resolve_cert_owner.yml

- name: host 分支：将 demo_partner 证书所有权规范化为 acps_systemd_user
  ansible.builtin.shell: |
    set -euo pipefail
    ROOT="{{ acps_runtime_root }}/components/demo_partner/partners/online"
    UID_GID="{{ acps_cert_owner_uid }}:{{ acps_cert_owner_gid }}"
    chown -R "$UID_GID" "$ROOT"
    find "$ROOT" -type f \( -name '*.key' -o -name '*.pem' \) -exec chmod 600 {} \;
    find "$ROOT" -type f -name 'acs.json' -exec chmod 644 {} \;
    find "$ROOT" -type f -name 'trust-bundle.pem' -exec chmod 644 {} \;
  args:
    executable: /bin/bash
  become: true

- name: 确保 demo_partner AMP 日志目录
  ansible.builtin.include_role:
    name: common
    tasks_from: normalize_data_dir.yml
  vars:
    acps_data_dir: "{{ acps_log_root }}/demo_partner"
    acps_data_dir_mode: "0755"

- name: 解析本轮上游 broker bounce
  ansible.builtin.include_role:
    name: common
    tasks_from: resolve_tls_upstream_bounce.yml

- name: 检查 demo_partner 单元是否已 active（首装补起）
  become: true
  ansible.builtin.command:
    argv: [systemctl, is-active, acps-demo_partner.service]
  register: _demo_partner_pre_active
  changed_when: false
  failed_when: false

- name: 判定 demo_partner 是否应 force recreate/restart
  ansible.builtin.set_fact:
    _demo_partner_force_recreate: >-
      {{
        (_acps_rabbitmq_bounced_this_run | default(false) | bool)
        or (
          (_demo_partner_pre_active.stdout | default('') | trim) != 'active'
        )
        or (acps_force_demo_partner_restart | default(false) | bool)
      }}

- name: 部署 demo_partner（host：systemd）
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_service.yml
  vars:
    acps_compose_service_name: demo_partner
    acps_compose_force_recreate: "{{ _demo_partner_force_recreate | bool }}"

- name: 开放 demo_partner 广告端口（host firewalld/ufw）
  ansible.builtin.include_role:
    name: common
    tasks_from: open_advertise_ports.yml
  vars:
    acps_open_ports:
      - "{{ demo_partner_port_food | default(9021) }}"
      - "{{ demo_partner_port_rural | default(9022) }}"
      - "{{ demo_partner_port_urban | default(9023) }}"
      - "{{ demo_partner_port_hotel | default(9024) }}"
      - "{{ demo_partner_port_transport | default(9025) }}"

- name: 等待 demo_partner TCP 端口
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ item }}"
    timeout: 120
  loop:
    - "{{ demo_partner_port_food | default(9021) }}"
    - "{{ demo_partner_port_rural | default(9022) }}"
    - "{{ demo_partner_port_urban | default(9023) }}"
    - "{{ demo_partner_port_hotel | default(9024) }}"
    - "{{ demo_partner_port_transport | default(9025) }}"
