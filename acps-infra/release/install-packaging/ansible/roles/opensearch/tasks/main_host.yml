---
# opensearch/tasks/main_host.yml — host 模式：官方 tarball（自带 JDK）+ systemd
# （本设计 §5.5 / §8.2.1 / Step 16）。索引模板由 monitor-server SystemWriter bootstrap。

- name: 确保运行时目录
  ansible.builtin.include_role:
    name: common
    tasks_from: ensure_runtime_dirs.yml

- name: 设置 OpenSearch 系统前置 vm.max_map_count=262144
  become: true
  block:
    - name: 写入 sysctl 配置
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-acps-opensearch.conf
        mode: "0644"
        content: |
          vm.max_map_count = 262144
      register: _os_sysctl_file

    - name: 应用 sysctl
      ansible.builtin.command:
        argv: [sysctl, --system]
      changed_when: _os_sysctl_file.changed | bool

    - name: 断言 vm.max_map_count 已生效
      ansible.builtin.command:
        argv: [sysctl, -n, vm.max_map_count]
      register: _os_map_count
      changed_when: false
      failed_when: (_os_map_count.stdout | trim | int) < 262144

- name: stage opensearch vendor_bundle
  ansible.builtin.include_role:
    name: common
    tasks_from: stage_artifact.yml
  vars:
    acps_component_key: opensearch
    acps_artifact_kind: vendor_bundle

- name: 解析 opensearch 数据目录属主（host：acps 系统账号）
  ansible.builtin.include_role:
    name: common
    tasks_from: resolve_cert_owner.yml
  vars:
    acps_cert_owner_user: ""

- name: 规范化 opensearch 数据目录属主
  ansible.builtin.include_role:
    name: common
    tasks_from: normalize_data_dir.yml
  vars:
    acps_data_dir: "{{ acps_data_root }}/opensearch"

- name: 准备 opensearch 配置与日志目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ acps_systemd_user }}"
    group: "{{ acps_systemd_group }}"
  loop:
    - "{{ acps_runtime_root }}/config/opensearch"
    - "{{ acps_runtime_root }}/config/opensearch/jvm.options.d"
    - "{{ acps_log_root }}/opensearch"

- name: 渲染 opensearch.yml（host）
  ansible.builtin.template:
    src: opensearch.yml.host.j2
    dest: "{{ acps_runtime_root }}/config/opensearch/opensearch.yml"
    mode: "0644"
    owner: "{{ acps_systemd_user }}"
    group: "{{ acps_systemd_group }}"

- name: 渲染 JVM heap options（host）
  ansible.builtin.template:
    src: jvm.options.d/acps-heap.options.j2
    dest: "{{ acps_runtime_root }}/config/opensearch/jvm.options.d/acps-heap.options"
    mode: "0644"
    owner: "{{ acps_systemd_user }}"
    group: "{{ acps_systemd_group }}"

# OPENSEARCH_PATH_CONF 指向 runtime config；启动器仍要求该目录含 jvm.options / log4j2.properties。
- name: 从 vendor 复制基础 jvm.options / log4j2.properties 到 PATH_CONF
  ansible.builtin.copy:
    src: "{{ acps_vendor_install_dest }}/config/{{ item }}"
    dest: "{{ acps_runtime_root }}/config/opensearch/{{ item }}"
    remote_src: true
    mode: "0644"
    owner: "{{ acps_systemd_user }}"
    group: "{{ acps_systemd_group }}"
    force: false
  loop:
    - jvm.options
    - log4j2.properties

- name: 渲染 opensearch EnvironmentFile（host-mode systemd）
  ansible.builtin.copy:
    content: |
      OPENSEARCH_PATH_CONF={{ acps_runtime_root }}/config/opensearch
      OPENSEARCH_JAVA_HOME={{ acps_vendor_unit_root | default(acps_vendor_install_dest) }}/jdk
    dest: "{{ acps_runtime_root }}/config/opensearch/.env"
    mode: "0600"
    owner: "{{ acps_systemd_user }}"
    group: "{{ acps_systemd_group }}"

- name: 渲染 opensearch systemd 单元
  ansible.builtin.include_role:
    name: common
    tasks_from: render_host_systemd.yml
  vars:
    acps_compose_service_name: opensearch
    acps_host_install_dest: "{{ acps_vendor_unit_root | default(acps_vendor_install_dest) }}"
    acps_host_env_file: "{{ acps_runtime_root }}/config/opensearch/.env"
    acps_host_entrypoint: >-
      {{ acps_vendor_unit_root | default(acps_vendor_install_dest) }}/bin/opensearch
    acps_host_unit_description: "ACPS OpenSearch (host vendor_bundle + bundled JDK)"

- name: Rocky SELinux：opensearch 数据/配置/vendor 目录打标签
  when: ansible_os_family == 'RedHat'
  ansible.builtin.include_role:
    name: common
    tasks_from: selinux_restore_path.yml
  vars:
    acps_selinux_path: "{{ item }}"
  loop:
    - "{{ acps_data_root }}/opensearch"
    - "{{ acps_log_root }}/opensearch"
    - "{{ acps_runtime_root }}/config/opensearch"
    - "{{ acps_vendor_install_dest }}"

- name: 开放 opensearch 广告端口（firewalld/ufw，幂等）
  ansible.builtin.include_role:
    name: common
    tasks_from: open_advertise_ports.yml
  vars:
    acps_open_ports:
      - "{{ opensearch_http_port }}"

- name: 部署 opensearch（systemd enable --now）
  ansible.builtin.include_role:
    name: common
    tasks_from: deploy_service.yml
  vars:
    acps_compose_service_name: opensearch
    acps_component_key: opensearch
    acps_compose_force_recreate: false

- name: 等待 OpenSearch HTTP 端口
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ opensearch_http_port }}"
    timeout: 180

- name: 健康检查：OpenSearch _cluster/health（本设计 §8.2.1）
  ansible.builtin.shell: |
    set -euo pipefail
    body=$(curl -fsS --max-time 10 "http://127.0.0.1:{{ opensearch_http_port }}/_cluster/health")
    python3 -c 'import json,sys; s=json.load(sys.stdin).get("status",""); assert s in ("green","yellow"), s' <<<"$body"
  args:
    executable: /bin/bash
  register: _os_health
  retries: 40
  delay: 3
  until: _os_health.rc == 0
  changed_when: false
