---
# rollback_one_component.yml — 单组件制品回滚（mode 无关编排）
#
# 期望（play vars）：
# acps_rollback_component_key — 规范 state key（非 acps_component_key：
# role 的 stage_artifact set_fact 否则会跨 play 泄漏）
# acps_rollback_role — Ansible role 名
# _acps_rollback_components — 规范列表（来自 preflight_rollback / 镜像）
# 可选：
# acps_rollback_to — 须匹配保留的 previous.version / image_tag / artifact_id / release_path
#
# 按 acps_deploy_mode 分派：
#   image → rollback_one_component_image.yml（既有语义，不得回归）
#   host  → rollback_one_component_host.yml（H4：current → previous releases）
#
# 不包含：migrate downgrade、renew-certs、down -v、删除数据目录、回滚证书。

- name: 组件未选择时跳过主机
  when: >-
    acps_rollback_component_key not in (
      _acps_rollback_components
      | default(hostvars['localhost']['_acps_rollback_components'] | default([]))
    )
  ansible.builtin.meta: end_host

- name: 在目标解析回滚选择列表
  ansible.builtin.set_fact:
    _acps_rollback_components: >-
      {{
        _acps_rollback_components
        | default(hostvars['localhost']['_acps_rollback_components'] | default([]))
      }}

- name: 为本回滚绑定 acps_component_key（覆盖陈旧 host fact）
  ansible.builtin.set_fact:
    acps_component_key: "{{ acps_rollback_component_key }}"

- name: 按 acps_deploy_mode 分派回滚实现
  ansible.builtin.include_tasks: "rollback_one_component_{{ acps_deploy_mode | default('image') }}.yml"
