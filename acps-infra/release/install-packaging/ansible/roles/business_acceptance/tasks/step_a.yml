---
# 步骤 A — 每个 demo Partner 的 Discovery 同步 + NL 查询。
# 通过门禁 = 每个 Partner AIC 的 NL 命中。不检查 Discovery LLM secret 是否存在。

- name: 步骤 A 前刷新 OIDC 会话（Keycloak / install Direct Access Grant）
  when: keycloak_enabled | bool
  ansible.builtin.shell: |
    set -euo pipefail
    PY="{{ acps_tools_python | default('python3') }}"
    SCRIPT="{{ acps_release_root }}/scripts/oidc_password_login.py"
    KC_HOST="{{ hostvars | acps_group_addr(groups, 'keycloak') }}"
    PUBLIC_BASE="http://${KC_HOST}:{{ keycloak_port }}"
    FETCH_ISSUER_REG="${PUBLIC_BASE}/realms/acps-registry"
    TOK="{{ acps_control_root }}/work/tokens"
    mkdir -p "$TOK"
    export ACPS_OIDC_PUBLIC_BASE_FILE="{{ acps_control_root }}/work/oidc_public_base"
    printf '%s\n' "$PUBLIC_BASE" > "$ACPS_OIDC_PUBLIC_BASE_FILE"
    "$PY" "$SCRIPT" \
      --issuer "$FETCH_ISSUER_REG" --public-base "$PUBLIC_BASE" \
      --client-id "{{ keycloak_registry_install_client_id | default('registry-install') }}" \
      --username "{{ registry_bootstrap_username | default(registry_admin_username) }}" \
      --password "{{ registry_bootstrap_password | default(registry_admin_password) }}" \
      --token-file "$TOK/registry-user.json" \
      --service registry --account-kind user \
      --session-issuer "http://${KC_HOST}:{{ keycloak_port }}/realms/acps-registry"
    "$PY" "$SCRIPT" \
      --issuer "$FETCH_ISSUER_REG" --public-base "$PUBLIC_BASE" \
      --client-id "{{ keycloak_registry_install_client_id | default('registry-install') }}" \
      --username "{{ registry_admin_username }}" \
      --password "{{ registry_admin_password }}" \
      --token-file "$TOK/registry-admin.json" \
      --service registry --account-kind admin \
      --session-issuer "http://${KC_HOST}:{{ keycloak_port }}/realms/acps-registry"
    CLI="{{ acps_cli_bin | default(acps_control_root ~ '/acps-cli/venv/bin/acps-cli') }}"
    CFG="{{ acps_cli_config | default(acps_control_root ~ '/acps-cli/acps-cli.toml') }}"
    "$CLI" --config "$CFG" auth status --json \
      | "$PY" -c 'import json,sys; d=json.load(sys.stdin); assert d.get("authenticated"), d'
    echo "OIDC_SESSIONS_OK_STEP_A"
  args:
    executable: /bin/bash

- name: Keycloak 关闭时断言 local-auth token 文件存在
  when: not (keycloak_enabled | bool)
  ansible.builtin.stat:
    path: "{{ acps_control_root }}/work/tokens/{{ item }}"
  loop:
    - registry-user.json
    - registry-admin.json
  register: _biz_a_token_stats

- name: local-auth token 缺失时失败
  when: not (keycloak_enabled | bool)
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
    fail_msg: >-
      local auth token missing: {{ acps_control_root }}/work/tokens/{{ item.item }}.
      Re-run site.yml (control_acps_cli / registry bootstrap) before business.yml.
  loop: "{{ _biz_a_token_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: 解析步骤 A 路径
  ansible.builtin.set_fact:
    _biz_a_cli: "{{ acps_cli_bin | default(acps_control_root ~ '/acps-cli/venv/bin/acps-cli') }}"
    _biz_a_cfg: "{{ acps_cli_config | default(acps_control_root ~ '/acps-cli/acps-cli.toml') }}"
    _biz_a_partner_root: "{{ acps_control_root }}/work/staging/demo-partner"
    _biz_a_leader_root: "{{ acps_control_root }}/work/staging/demo-leader"

- name: 运行 Discovery NL 查询验收（步骤 A）
  ansible.builtin.command:
    argv: >-
      {{
        [
          acps_tools_python | default('python3'),
          acps_release_root ~ '/scripts/business_acceptance_step_a.py',
          '--cli-bin', _biz_a_cli,
          '--cli-config', _biz_a_cfg,
          '--partner-root', _biz_a_partner_root,
          '--sync-wait-seconds', (acps_business_step_a_sync_wait_seconds | default(120) | string),
          '--query-timeout-seconds', (acps_business_step_a_query_timeout_seconds | default(180) | string),
          '--poll-interval-seconds', (acps_business_step_a_poll_interval_seconds | default(5) | string),
          '--query-limit', (acps_business_step_a_query_limit | default(10) | string),
        ]
        + (
          ['--include-leader', '--leader-root', _biz_a_leader_root]
          if (acps_business_step_a_include_leader | default(false) | bool)
          else []
        )
      }}
  environment:
    ACPS_OIDC_PUBLIC_BASE_FILE: "{{ acps_control_root }}/work/oidc_public_base"
  register: _biz_a
  changed_when: false

- name: 步骤 A 摘要
  ansible.builtin.debug:
    msg: "{{ _biz_a.stdout_lines | default([]) }}"
