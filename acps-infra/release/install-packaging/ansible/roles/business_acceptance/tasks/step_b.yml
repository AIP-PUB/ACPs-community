---
# 步骤 B — Leader↔Partner direct_rpc happy path。
# Auth：Keycloak 开启 → leader-install password grant；local → 无 Bearer。

- name: 解析 Leader advertise host for Step B/C
  ansible.builtin.set_fact:
    _biz_leader_host: "{{ hostvars | acps_group_addr(groups, 'demo_leader') }}"
    _biz_leader_api: >-
      http://{{ hostvars | acps_group_addr(groups, 'demo_leader') }}:{{
        demo_leader_web_port | default(9030) }}/api/v1
    _biz_leader_token_file: "{{ acps_control_root }}/work/tokens/leader-user.json"

- name: 刷新 Leader OIDC session (Keycloak / install Direct Access Grant)
  when: keycloak_enabled | bool
  ansible.builtin.shell: |
    set -euo pipefail
    PY="{{ acps_tools_python | default('python3') }}"
    SCRIPT="{{ acps_release_root }}/scripts/oidc_password_login.py"
    KC_HOST="{{ hostvars | acps_group_addr(groups, 'keycloak') }}"
    PUBLIC_BASE="http://${KC_HOST}:{{ keycloak_port }}"
    FETCH_ISSUER="${PUBLIC_BASE}/realms/acps-leader"
    TOK="{{ acps_control_root }}/work/tokens"
    mkdir -p "$TOK"
    export ACPS_OIDC_PUBLIC_BASE_FILE="{{ acps_control_root }}/work/oidc_public_base"
    printf '%s\n' "$PUBLIC_BASE" > "$ACPS_OIDC_PUBLIC_BASE_FILE"
    "$PY" "$SCRIPT" \
      --issuer "$FETCH_ISSUER" --public-base "$PUBLIC_BASE" \
      --client-id "{{ keycloak_leader_install_client_id | default('leader-install') }}" \
      --username "{{ leader_oidc_user_username | default('leader-user') }}" \
      --password "{{ leader_oidc_user_password | default('demo123') }}" \
      --token-file "$TOK/leader-user.json" \
      --service leader --account-kind user \
      --session-issuer "http://${KC_HOST}:{{ keycloak_port }}/realms/acps-leader"
    test -s "$TOK/leader-user.json"
    echo "OIDC_LEADER_SESSION_OK_STEP_B"
  args:
    executable: /bin/bash

- name: 断言 no stale Leader token required when Keycloak off
  when: not (keycloak_enabled | bool)
  ansible.builtin.debug:
    msg: >-
      local auth: Leader API accepts unauthenticated human calls
      (LEADER_OIDC_ENABLED=false); Step B will not send Bearer.

- name: 运行 direct_rpc acceptance (Step B)
  ansible.builtin.command:
    argv: >-
      {{
        [
          acps_tools_python | default('python3'),
          acps_release_root ~ '/scripts/business_acceptance_step_b.py',
          '--api-base-url', _biz_leader_api,
          '--rpc-poll-interval-seconds', (acps_business_step_b_rpc_poll_interval_seconds | default(1) | string),
          '--rpc-poll-timeout-seconds', (acps_business_step_b_rpc_poll_timeout_seconds | default(120) | string),
          '--task-poll-timeout-seconds', (acps_business_step_b_task_poll_timeout_seconds | default(180) | string),
          '--http-timeout-seconds', (acps_business_step_b_http_timeout_seconds | default(180) | string),
          '--llm-retries', (acps_business_step_b_llm_retries | default(2) | string),
          '--llm-retry-delay-seconds', (acps_business_step_b_llm_retry_delay_seconds | default(3) | string),
        ]
        + (
          ['--token-file', _biz_leader_token_file]
          if (keycloak_enabled | bool)
          else []
        )
      }}
  environment:
    ACPS_OIDC_PUBLIC_BASE_FILE: "{{ acps_control_root }}/work/oidc_public_base"
  register: _biz_b
  changed_when: false

- name: 步骤 B 摘要
  ansible.builtin.debug:
    msg: "{{ _biz_b.stdout_lines | default([]) }}"
