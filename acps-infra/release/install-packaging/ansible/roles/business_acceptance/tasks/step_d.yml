---
# 步骤 D — AMP 可观测性收敛。
# D1：Monitor audit/access/message/metrics/system（禁止 /health、禁止 heartbeat）。
# D2：Discovery alive-sync 状态 + 发现 Leader 与全部 Partner 的 aliveMap
# （禁止将 Monitor heartbeat API 作为通过条件）。

- name: 步骤 D 要求 Monitor + Discovery
  ansible.builtin.assert:
    that:
      - monitor_server_enabled | bool
      - discovery_server_enabled | bool
    fail_msg: >-
      Step D requires monitor_server_enabled=true and discovery_server_enabled=true
      (Forwarder + Writers + Monitor→Discovery alive-sync; ).
      Without them business acceptance cannot pass D1/D2.

- name: 解析步骤 D 主机与路径
  ansible.builtin.set_fact:
    _biz_d_monitor_base: >-
      http://{{ hostvars | acps_group_addr(groups, 'monitor_server') }}:{{
        monitor_server_port | default(9009) }}
    _biz_d_discovery_base: >-
      http://{{ hostvars | acps_group_addr(groups, 'discovery_server') }}:{{
        discovery_server_port | default(9005) }}
    _biz_d_cli: "{{ acps_cli_bin | default(acps_control_root ~ '/acps-cli/venv/bin/acps-cli') }}"
    _biz_d_cfg: "{{ acps_cli_config | default(acps_control_root ~ '/acps-cli/acps-cli.toml') }}"
    _biz_d_partner_root: "{{ acps_control_root }}/work/staging/demo-partner"
    _biz_d_leader_root: "{{ acps_control_root }}/work/staging/demo-leader"
    _biz_d_monitor_token: "{{ acps_control_root }}/work/tokens/monitor-admin.json"

- name: 步骤 D 前刷新 Monitor + Registry OIDC 会话（Keycloak）
  when: keycloak_enabled | bool
  ansible.builtin.shell: |
    set -euo pipefail
    PY="{{ acps_tools_python | default('python3') }}"
    SCRIPT="{{ acps_release_root }}/scripts/oidc_password_login.py"
    KC_HOST="{{ hostvars | acps_group_addr(groups, 'keycloak') }}"
    PUBLIC_BASE="http://${KC_HOST}:{{ keycloak_port }}"
    FETCH_ISSUER_MON="${PUBLIC_BASE}/realms/acps-monitor"
    FETCH_ISSUER_REG="${PUBLIC_BASE}/realms/acps-registry"
    TOK="{{ acps_control_root }}/work/tokens"
    mkdir -p "$TOK"
    export ACPS_OIDC_PUBLIC_BASE_FILE="{{ acps_control_root }}/work/oidc_public_base"
    printf '%s\n' "$PUBLIC_BASE" > "$ACPS_OIDC_PUBLIC_BASE_FILE"
    "$PY" "$SCRIPT" \
      --issuer "$FETCH_ISSUER_MON" --public-base "$PUBLIC_BASE" \
      --client-id "{{ keycloak_monitor_install_client_id | default('monitor-install') }}" \
      --username "{{ monitor_oidc_admin_username | default('monitor-admin') }}" \
      --password "{{ monitor_oidc_admin_password | default(registry_admin_password) }}" \
      --token-file "$TOK/monitor-admin.json" \
      --service monitor --account-kind admin \
      --session-issuer "http://${KC_HOST}:{{ keycloak_port }}/realms/acps-monitor"
    "$PY" "$SCRIPT" \
      --issuer "$FETCH_ISSUER_REG" --public-base "$PUBLIC_BASE" \
      --client-id "{{ keycloak_registry_install_client_id | default('registry-install') }}" \
      --username "{{ registry_bootstrap_username | default(registry_admin_username) }}" \
      --password "{{ registry_bootstrap_password | default(registry_admin_password) }}" \
      --token-file "$TOK/registry-user.json" \
      --service registry --account-kind user \
      --session-issuer "http://${KC_HOST}:{{ keycloak_port }}/realms/acps-registry"
    test -s "$TOK/monitor-admin.json"
    test -s "$TOK/registry-user.json"
    echo "OIDC_SESSIONS_OK_STEP_D"
  args:
    executable: /bin/bash

- name: Keycloak 关闭时断言 local-auth token 存在（D2 discover 用 registry）
  when: not (keycloak_enabled | bool)
  ansible.builtin.stat:
    path: "{{ acps_control_root }}/work/tokens/{{ item }}"
  loop:
    - registry-user.json
  register: _biz_d_token_stats

- name: local-auth registry token 缺失时失败
  when: not (keycloak_enabled | bool)
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
    fail_msg: >-
      local auth token missing: {{ acps_control_root }}/work/tokens/{{ item.item }}.
      Re-run site.yml (control_acps_cli) before business.yml Step D.
  loop: "{{ _biz_d_token_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Local auth — Monitor 查询无需 Bearer
  when: not (keycloak_enabled | bool)
  ansible.builtin.debug:
    msg: >-
      local auth: Monitor OIDC off — Step D1 sends unauthenticated query APIs
      (admin scope). D2 uses Discovery /admin/alive-sync/status + acps-cli discover.

- name: 运行 AMP 可观测性验收（步骤 D）
  ansible.builtin.command:
    argv: >-
      {{
        [
          acps_tools_python | default('python3'),
          acps_release_root ~ '/scripts/business_acceptance_step_d.py',
          '--monitor-base-url', _biz_d_monitor_base | trim,
          '--discovery-base-url', _biz_d_discovery_base | trim,
          '--cli-bin', _biz_d_cli,
          '--cli-config', _biz_d_cfg,
          '--partner-root', _biz_d_partner_root,
          '--leader-root', _biz_d_leader_root,
          '--lookback-seconds', (acps_business_step_d_lookback_seconds | default(7200) | string),
          '--d1-timeout-seconds', (acps_business_step_d_d1_timeout_seconds | default(180) | string),
          '--d2-timeout-seconds', (acps_business_step_d_d2_timeout_seconds | default(180) | string),
          '--poll-interval-seconds', (acps_business_step_d_poll_interval_seconds | default(5) | string),
          '--http-timeout-seconds', (acps_business_step_d_http_timeout_seconds | default(30) | string),
        ]
        + (
          ['--monitor-token-file', _biz_d_monitor_token]
          if (keycloak_enabled | bool)
          else []
        )
      }}
  environment:
    ACPS_OIDC_PUBLIC_BASE_FILE: "{{ acps_control_root }}/work/oidc_public_base"
  register: _biz_d
  changed_when: false

- name: 步骤 D 摘要
  ansible.builtin.debug:
    msg: "{{ _biz_d.stdout_lines | default([]) }}"
