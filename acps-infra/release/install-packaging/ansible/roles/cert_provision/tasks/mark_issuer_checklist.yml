---
# 本 profile 已成功 bootstrap+分发后，在 issuer 旋转 checklist 上打勾。
# 期望：cert_provision_profile
# 仅当 .force-cert-renew 或 .issuer-material-sha256.pending 存在时写入。

- name: 检查 issuer 旋转是否进行中
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ acps_control_root }}/work/certs/.force-cert-renew"
    - "{{ acps_control_root }}/work/certs/.issuer-material-sha256.pending"
  register: _issuer_rot_marks
  delegate_to: localhost
  become: false

- name: issuer 旋转进行中 → 本 profile 打勾
  when: >-
    (_issuer_rot_marks.results | selectattr('stat.exists') | list | length) > 0
  block:
    - name: 确保 checklist 目录
      ansible.builtin.file:
        path: "{{ acps_control_root }}/work/certs/.issuer-renew-checklist"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: 写入 profile checklist 标记
      ansible.builtin.copy:
        dest: "{{ acps_control_root }}/work/certs/.issuer-renew-checklist/{{ cert_provision_profile }}"
        content: "ok\n"
        mode: "0644"
      delegate_to: localhost
      become: false
