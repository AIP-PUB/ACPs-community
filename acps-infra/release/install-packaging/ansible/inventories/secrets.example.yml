# 敏感变量清单。复制为 secrets.yml，将 CHANGE_ME 替换为实际值，并 chmod 600。
# 请勿将 secrets.yml 提交到 git。
#
# 拼进 REDIS_URL / DATABASE_URL / AMQP 的口令与用户名：禁止含 # @ : / ? 或空白
#（预检会拒绝）。模板会对 userinfo 做 URL 编码，但仍建议只用字母数字与 . _ - !。

# PostgreSQL
postgresql_superuser_password: "CHANGE_ME"
registry_db_password: "CHANGE_ME"
ca_db_password: "CHANGE_ME"
discovery_db_password: "CHANGE_ME"
monitor_db_password: "CHANGE_ME"
keycloak_db_password: "CHANGE_ME"

# 基础设施
redis_password: "CHANGE_ME"
rabbitmq_password: "CHANGE_ME"
rabbitmq_user: "admin"
mq_auth_mgmt_pass: "CHANGE_ME"

# Registry 本地认证与加密
# registry_admin_* / registry_bootstrap_* 同时用于：
# 1) Registry 本地认证（未启用 Keycloak OIDC 时）
# 2) Keycloak OIDC 启用时，安装层会把同一组用户名/密码写入 Keycloak realm（种子用户）
# registry_bootstrap_* 为 ACS save/submit 专用 CLIENT 用户（须与 admin 区分，避免 refresh token 冲突）
registry_admin_username: "admin"
registry_admin_password: "admin123"
registry_bootstrap_username: "installer"
registry_bootstrap_password: "installer123"
registry_secret_key: "CHANGE_ME_TO_RANDOM_HEX_64"
registry_sm4_encryption_key: "0123456789abcdeffedcba9876543210"
registry_aic_crc_salt: "0xAABBCCDD"
registry_server_internal_api_token: "CHANGE_ME_INTERNAL_TOKEN"

# Discovery LLM / embedding — 由 role 渲染进 discovery_server env
# - CPU（discovery_server_variant: cpu，group_vars 默认）：通常需要可用的 discovery_llm_* / embedding_* 才能 NL 查询命中
# - GPU（discovery_server_variant: gpu）：通常不依赖外部 LLM；下列键可留空 / 未使用（仍会渲染，应用走 GPU 路径时忽略）
# - business.yml Step A 不得单独断言这些 secret 是否存在；通过/失败仅看各 demo Partner 的 NL 查询是否命中
# - 下列 base_url / model 仅为示例形态（OpenAI 兼容网关）；api_key 须自行填写，勿提交真实密钥
discovery_llm_api_key: ""
discovery_llm_base_url: "https://api.siliconflow.com/v1"
discovery_llm_model_name: "deepseek-ai/DeepSeek-V4-Flash"
embedding_api_key: ""
embedding_base_url: "https://api.siliconflow.com/v1"
embedding_model_name: "Qwen/Qwen3-Embedding-4B"
embedding_dim: "1024"  # 须与 Discovery DB 向量维度一致（alembic 默认 1024）
# embedding 网关偶发慢时可拉高超时；CPU LLM 终选可跳过（NL 命中仍靠 embedding/CPU ranking）
embedding_timeout: "180"
dsp_semantic_index_concurrency: "1"
discovery_skip_cpu_llm: "1"
dsp_webhook_secret: "CHANGE_ME_WEBHOOK_SECRET"

# Monitor→Discovery 心跳同步 — Monitor /sync/* 与 Discovery alive-sync 共用的 Bearer
# Keycloak OIDC 开启时必填（HEARTBEAT_SYNC_INTERNAL_TOKEN / ALIVE_SYNC_PROVIDER_BEARER_TOKEN）
# monitor_server_enabled 时 role 会断言长度 >= 16 且非 CHANGE_ME*
monitor_heartbeat_sync_internal_token: "CHANGE_ME_HEARTBEAT_SYNC_TOKEN"

# Keycloak（仅 keycloak_enabled 时）
keycloak_admin_user: "admin"
keycloak_admin_password: "CHANGE_ME"
# Monitor OIDC 便利账号（默认与 realm import 对齐）
monitor_oidc_admin_username: "monitor-admin"
monitor_oidc_admin_password: "CHANGE_ME"
# 业务验收 Step B/C 用的 Leader OIDC 用户（经 leader-install Direct Access Grant）
# 默认与 acps-leader realm import 一致（leader-user / demo123）
leader_oidc_user_username: "leader-user"
leader_oidc_user_password: "demo123"

# Demo LLM — Leader/Partner 各 tier 共享默认值
# base_url / model 仅为示例形态（OpenAI 兼容网关）；api_key 须自行填写，勿提交真实密钥
# 业务验收 Step B/C 依赖可用网关与密钥；失败表现为业务断言失败，而非单独的 secret 存在性探针
demo_llm_api_key: ""
demo_llm_base_url: "https://api.siliconflow.com/v1"
demo_llm_model: "deepseek-ai/DeepSeek-V4-Pro"

# 按 tier 覆盖（省略则回退 demo_llm_*）
# demo_leader role → LEADER_LLM_{FAST,DEFAULT,PRO}_*
# demo_partner role → PARTNER_LLM_{FAST,DEFAULT,PRO}_*
demo_leader_llm_fast_api_key: ""
demo_leader_llm_fast_base_url: "https://api.siliconflow.com/v1"
demo_leader_llm_fast_model: "deepseek-ai/DeepSeek-V4-Flash"
demo_leader_llm_default_api_key: ""
demo_leader_llm_default_base_url: "https://api.siliconflow.com/v1"
demo_leader_llm_default_model: "deepseek-ai/DeepSeek-V4-Pro"
demo_leader_llm_pro_api_key: ""
demo_leader_llm_pro_base_url: "https://api.siliconflow.com/v1"
demo_leader_llm_pro_model: "deepseek-ai/DeepSeek-V4-Pro"
demo_partner_llm_fast_api_key: ""
demo_partner_llm_fast_base_url: "https://api.siliconflow.com/v1"
demo_partner_llm_fast_model: "deepseek-ai/DeepSeek-V4-Flash"
demo_partner_llm_default_api_key: ""
demo_partner_llm_default_base_url: "https://api.siliconflow.com/v1"
demo_partner_llm_default_model: "deepseek-ai/DeepSeek-V4-Pro"
demo_partner_llm_pro_api_key: ""
demo_partner_llm_pro_base_url: "https://api.siliconflow.com/v1"
demo_partner_llm_pro_model: "deepseek-ai/DeepSeek-V4-Pro"

# 业务验收稳定开关（产品默认关；复制 secrets 时按需打开）
acps_llm6_force_fallback: "1"
partner_force_accept_decision: "1"
# Group mode wait for slow Partner LLM (default 600 in env.j2 / GroupExecutorConfig)
acps_group_max_wait_seconds: "600"

# MinIO（AMP）— ROOT_USER >= 3 字符，ROOT_PASSWORD >= 8 字符（MinIO 上游约束）
minio_root_user: "minioadmin"
minio_root_password: "CHANGE_ME_MINIO"

# OpenSearch（AMP）
opensearch_initial_admin_password: "CHANGE_ME_OpenSearch1!"
