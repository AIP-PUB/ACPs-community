[project]
name = "acps-sdk"
version = "2.2.0"
description = "ACPs SDK - Agent Collaboration Protocols SDK"
authors = [{ name = "Team", email = "team@ioa.pub" }]
readme = "README.md"
license = "MulanPSL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "aio-pika>=9.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
amp-sign = ["jcs>=0.2.0", "cryptography>=48.0.1"]
oidc = ["PyJWT[crypto]>=2.13.0"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "cryptography>=48.0.1",
    "jcs>=0.2.0",
    "pytest-asyncio>=1.4.0",
    "anyio>=4.13.0",
    # OIDC 测试需要 PyJWT；运行时消费者仍通过 optional-dependencies.oidc 安装
    "PyJWT[crypto]>=2.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acps_sdk"]
